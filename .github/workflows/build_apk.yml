name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build TOD Sports APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Project Structure & Gradle Wrapper
        run: |
          echo "=== Inspecting workspace ==="
          ls -la

          # If project was placed in a subdirectory (e.g. nested folder during zip upload)
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            SUB_SETTINGS=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
            if [ -n "$SUB_SETTINGS" ]; then
              SUB_DIR=$(dirname "$SUB_SETTINGS")
              echo "Android project detected in subfolder $SUB_DIR -> moving files to workspace root..."
              shopt -s dotglob
              mv "$SUB_DIR"/* .
              shopt -u dotglob
            fi
          fi

          # Ensure gradlew exists and is executable
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found at root, fetching official gradle wrapper..."
            curl -sLo gradlew https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradlew
          fi
          chmod +x gradlew || true

          # Ensure gradle-wrapper.jar exists
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar missing, downloading wrapper jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APKs (Release & Debug)
        run: |
          echo "=== Building Android APKs ==="
          ./gradlew :app:assembleRelease :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:+UseParallelGC" \
            -x test \
            -x lint || ./gradlew assemble --no-daemon --no-configuration-cache -x test -x lint

      - name: Collect Generated APKs
        run: |
          mkdir -p release_apks
          echo "Searching for generated APK files..."
          find . -name "*.apk" -not -path "*/intermediates/*" -exec cp -v {} release_apks/ \;
          echo "Collected APKs:"
          ls -la release_apks/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TOD-Sports-APKs
          path: release_apks/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: v${{ github.run_number }}
          name: "📱 TOD Sports APK (Release #${{ github.run_number }})"
          body: |
            ### ⚽ تم بناء تطبيق TOD Sports بنجاح وسرعة فائقة! 🚀
            
            - 🌟 **app-release.apk**: النسخة المعتمدة والمحسنة للأداء العالي وتوفير الذاكرة.
            - 🛠️ **app-debug.apk**: النسخة التجريبية.
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
