name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build TOD Sports Fast Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Project Structure & Gradle Wrapper
        run: |
          echo "=== Setting up project workspace ==="
          ls -la

          # If project was placed in a subdirectory during commit/upload
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            SUB_SETTINGS=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
            if [ -n "$SUB_SETTINGS" ]; then
              SUB_DIR=$(dirname "$SUB_SETTINGS")
              echo "Moving Android project from $SUB_DIR to root..."
              shopt -s dotglob
              mv "$SUB_DIR"/* .
              shopt -u dotglob
            fi
          fi

          # Ensure gradlew exists and is executable
          if [ ! -f "gradlew" ]; then
            echo "Fetching official gradle wrapper script..."
            curl -sLo gradlew https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradlew
          fi
          chmod +x gradlew || true

          # Ensure gradle-wrapper.jar exists
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Prepare Release Signing Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TOD Sports,O=TOD,C=US"
          fi

      - name: Build Ultra-Fast Smooth Release APK
        run: |
          echo "=== Building Single Optimized Release APK ==="
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --build-cache \
            --parallel \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:+UseParallelGC" \
            -x test \
            -x lint

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p final_apk
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" final_apk/TOD-Sports-Release.apk
          else
            # Search for release apk
            RELEASE_FILE=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
            if [ -n "$RELEASE_FILE" ]; then
              cp "$RELEASE_FILE" final_apk/TOD-Sports-Release.apk
            else
              find . -name "*.apk" -not -path "*/intermediates/*" -exec cp -v {} final_apk/TOD-Sports-Release.apk \;
            fi
          fi
          echo "Final Release APK prepared:"
          ls -la final_apk/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOD-Sports-Release-APK
          path: final_apk/TOD-Sports-Release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: v${{ github.run_number }}
          name: "📱 TOD Sports VIP (Release v${{ github.run_number }})"
          body: |
            ### ⚡ تم بناء النسخة الرسمية السريعة والسلسة (Release Only)! 🚀
            
            - 🌟 **TOD-Sports-Release.apk**: النسخة الرسمية الصافية فائقة السرعة والخفة، مصممة للعمل بسلاسة تامة على كافة الهواتف وبأعلى أداء ممكن لتشغيل البث والمباريات.
          files: final_apk/TOD-Sports-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
